name: Security

on:
  push:
    branches: [main, master, "security/**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the workspace lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit the initial lockfile on this setup branch
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')) ||
          (github.event_name == 'pull_request' &&
           startsWith(github.event.pull_request.head.ref, 'security/') &&
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -f pnpm-lock.yaml ] && ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add pnpm workspace lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Audit locked dependencies
        run: pnpm audit --audit-level high

  codeql:
    name: CodeQL code scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
