name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-auth-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinelai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelai
      JWT_ACCESS_SECRET: ci-only-access-secret-change-me-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-change-me-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply database migrations
        run: |
          for migration in apps/api/prisma/migrations/*/migration.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Type check
        run: pnpm typecheck
      - name: Build workspaces
        run: pnpm build
      - name: Build API production container image
        run: docker build --pull -f Dockerfile.api -t sentinelai-api:ci .
      - name: Build web production container image
        run: docker build --pull -f Dockerfile.web -t sentinelai-web:ci .
      - name: Scan production images and generate SBOMs
        run: bash scripts/scan-container-images.sh
      - name: Upload container SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelai-container-sboms
          path: artifacts/container-sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run authentication integration tests
        run: pnpm --filter @sentinelai/api test:integration
      - name: Test production deployment smoke checks
        run: node --test scripts/production-smoke-check.test.mjs
      - name: Validate Prometheus and Alertmanager configuration
        run: bash scripts/validate-monitoring-config.sh
      - name: Validate first-owner bootstrap script
        run: node --check apps/api/scripts/bootstrap-admin.mjs
      - name: Check required foundation files
        run: |
          test -f README.md
          test -f apps/api/prisma/schema.prisma
          test -f apps/api/prisma/migrations/20261119000000_init/migration.sql
          test -f apps/api/prisma/migrations/20261119000100_audit_integrity_chain/migration.sql
          test -f docs/ARCHITECTURE.md
      - name: Check for committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env.example$'; then
            echo "Potential secret-bearing environment file is tracked."
            exit 1
          fi
