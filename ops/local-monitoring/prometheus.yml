global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sentinelai-api
    metrics_path: /api/v1/metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - host.docker.internal:4000
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
