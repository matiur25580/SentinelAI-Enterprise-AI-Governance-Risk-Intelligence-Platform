global:
  resolve_timeout: 5m

route:
  receiver: local-noop
  group_by:
    - alertname
    - service
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  # Local development intentionally does not send notifications.
  # Configure a real receiver only in a protected deployment environment.
  - name: local-noop
