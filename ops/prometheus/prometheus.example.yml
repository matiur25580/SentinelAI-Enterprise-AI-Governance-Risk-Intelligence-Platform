global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    service: sentinelai

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: sentinelai-api
    metrics_path: /api/v1/metrics
    scheme: https
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      # Replace with the private DNS name or address reachable from Prometheus.
      - targets:
          - api.example.internal
    authorization:
      type: Bearer
      # Provision this file through your secret manager; never commit its contents.
      credentials_file: /etc/prometheus/secrets/sentinelai-metrics-token
    tls_config:
      min_version: TLS12
      # Keep certificate verification enabled. Install the issuing CA in the
      # Prometheus trust store instead of setting insecure_skip_verify.
